{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="page-wrapper" style="max-width:480px">
  <div class="page-header text-center">
    <h1><i class="fas fa-calendar-check text-brand"></i> BookMtaani</h1>
    <p class="text-muted">Sign in to your account</p>
  </div>

  <div class="card">
    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'core:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_username">Username</label>
        <input id="id_username" type="text" name="username" class="form-input" required autofocus autocomplete="username" placeholder="Username">
      </div>
      <div class="form-group">
        <label class="form-label" for="id_password">Password</label>
        <input id="id_password" type="password" name="password" class="form-input" required autocomplete="current-password" placeholder="Password">
      </div>
      <button type="submit" class="btn btn-brand w-full" style="justify-content:center; margin-top:0.5rem">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <hr class="divider">
    <p class="text-center text-muted" style="font-size:0.9rem">
      No account? <a href="{% url 'core:register' %}" style="color:var(--color-brand)">Create one</a>
    </p>
  </div>

</div>
{% endblock %}
